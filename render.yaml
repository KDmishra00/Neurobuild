# Render Blueprint — NeuroBuild
# Import this file in Render: New + → Blueprint → Public Repository → paste your GitHub repo.
# Render builds the Docker image and provisions an auto-deploying web service.

services:
  - type: web
    name: neurobuild
    runtime: docker
    repo: https://github.com/KDmishra00/Neurobuild
    plan: free
    dockerfilePath: ./Dockerfile
    region: oregon
    autoDeploy: true
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false