# NeuroBuild CI/CD — Lint, Test, Build & Deploy
# Runs on every push/PR to main. Deploys automatically on merge.
name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ─── Stage 1: Lint & Test ────────────────────────────────────────────
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Server dependencies
      - name: Install server dependencies
        run: npm ci

      # Client dependencies
      - name: Install client dependencies
        run: npm ci
        working-directory: client

      # Backend unit & logic tests
      - name: Run backend tests
        run: npm run test:logic

      # Client lint check
      - name: Lint client
        run: npm run lint
        working-directory: client

      # Client type-check + production build
      - name: Build client
        run: npm run build
        working-directory: client

  # ─── Stage 2: Deploy to Vercel (only on push to main) ────────────────
  deploy:
    name: Deploy to Vercel
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
