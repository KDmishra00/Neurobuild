<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Neurobuild</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(129, 140, 248, 0.05) 50%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }

  .auth-card {
    width: 100%;
    max-width: 420px;
    padding: 36px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    backdrop-filter: var(--glass-backdrop);
    -webkit-backdrop-filter: var(--glass-backdrop);
    position: relative;
    z-index: 1;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .auth-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .auth-logo {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.8px;
    color: var(--text);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .auth-logo .logo-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    font-size: 15px;
  }

  .auth-subtitle {
    color: var(--text2);
    font-size: 14px;
    font-weight: 400;
  }

  /* Social buttons */
  .social-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 11px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition-fast);
    margin-bottom: 10px;
  }

  .social-btn:hover {
    background: var(--surface3);
    border-color: var(--border-hover);
  }

  .social-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 20px 0;
    color: var(--text3);
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .form-group {
    margin-bottom: 16px;
    position: relative;
  }

  .password-wrapper {
    position: relative;
  }

  .password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    padding: 4px;
  }

  .password-toggle:hover {
    color: var(--text);
  }

  .submit-btn {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
  }

  .footer-text {
    margin-top: 24px;
    font-size: 12.5px;
    color: var(--text3);
    text-align: center;
    line-height: 1.5;
  }

  .footer-text a {
    color: var(--accent2);
    text-decoration: none;
    font-weight: 500;
  }

  .footer-text a:hover {
    text-decoration: underline;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 3px;
    margin-bottom: 24px;
    border: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    padding: 8px 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    border-radius: 6px;
    cursor: pointer;
    transition: var(--transition-fast);
    border: none;
    background: transparent;
    font-family: inherit;
  }

  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
  }

  .forgot-link {
    position: absolute;
    right: 0;
    top: 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent2);
    text-decoration: none;
  }

  .forgot-link:hover {
    text-decoration: underline;
  }

  /* View toggling */
  .view-section { display: none; }
  .view-section.active { display: block; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    text-decoration: none;
    margin-bottom: 20px;
    cursor: pointer;
    transition: var(--transition-fast);
  }

  .back-link:hover {
    color: var(--text);
  }
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <div class="auth-logo">
      <div class="logo-icon">N</div>
      Neuro<span>build</span>
    </div>
    <div class="auth-subtitle">AI-Powered Website Builder</div>
  </div>

  <div id="errorMsg" class="form-error"></div>
  <div id="successMsg" class="toast success" style="position: static; transform: none; opacity: 1; display: none; margin-bottom: 16px;"></div>

  <!-- AUTH VIEW (Login/Register) -->
  <div id="authView" class="view-section active">
    <div class="tabs">
      <button class="tab active" id="loginTab">Sign in</button>
      <button class="tab" id="registerTab">Create account</button>
    </div>

    <!-- Social login -->
    <button class="social-btn" onclick="showMessage('Google login coming soon')">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <button class="social-btn" onclick="showMessage('GitHub login coming soon')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      Continue with GitHub
    </button>

    <div class="divider">or</div>

    <form id="authForm">
      <div id="nameField" class="form-group" style="display: none;">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-input" placeholder="johndoe" pattern="[a-zA-Z0-9_-]{3,30}" title="3-30 characters: letters, numbers, underscores, hyphens">
      </div>
      <div id="displayNameField" class="form-group" style="display: none;">
        <label for="name" class="form-label">Full name</label>
        <input type="text" id="name" class="form-input" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input type="email" id="email" class="form-input" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <a href="#" class="forgot-link" id="showForgotLink">Forgot?</a>
        <div class="password-wrapper">
          <input type="password" id="password" class="form-input" required placeholder="••••••••" minlength="6">
          <button type="button" class="password-toggle" id="togglePasswordBtn">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary submit-btn" id="submitBtn">Sign in</button>
    </form>
  </div>

  <!-- FORGOT PASSWORD VIEW -->
  <div id="forgotView" class="view-section">
    <a class="back-link" id="backToLoginFromForgot">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back to login
    </a>
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Reset Password</h2>
    <p style="font-size: 13.5px; color: var(--text2); margin-bottom: 24px;">Enter your email and we'll send you a reset link.</p>
    
    <form id="forgotForm">
      <div class="form-group">
        <label for="forgotEmail" class="form-label">Email address</label>
        <input type="email" id="forgotEmail" class="form-input" required placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary submit-btn" id="forgotBtn">Send reset link</button>
    </form>
  </div>

  <!-- RESET PASSWORD VIEW -->
  <div id="resetView" class="view-section">
    <a href="login.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back to login
    </a>
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Create New Password</h2>
    <p style="font-size: 13.5px; color: var(--text2); margin-bottom: 24px;">Please enter your new password.</p>
    
    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword" class="form-label">New Password</label>
        <input type="password" id="newPassword" class="form-input" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary submit-btn" id="resetBtn">Reset password</button>
    </form>
  </div>

  <p class="footer-text">
    By continuing, you agree to Neurobuild's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
  </p>
</div>

<script src="/js/api.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const resetToken = urlParams.get('reset');
  
  if (!resetToken) {
    window.NeuroAPI.redirectIfAuth();
  }

  let mode = 'login';
  
  function hideMessages() {
    document.getElementById('errorMsg').classList.remove('visible');
    const successEl = document.getElementById('successMsg');
    if (successEl) successEl.style.display = 'none';
  }

  function showError(msg) {
    hideMessages();
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function showSuccess(msg) {
    hideMessages();
    const el = document.getElementById('successMsg');
    el.textContent = msg;
    el.style.display = 'flex';
  }

  function showView(viewId) {
    hideMessages();
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

  // Handle initialization (if reset token in URL)
  if (resetToken) {
    showView('resetView');
  }

  // Password Visibility Toggle
  const togglePassBtn = document.getElementById('togglePasswordBtn');
  const passInput = document.getElementById('password');
  if (togglePassBtn && passInput) {
    togglePassBtn.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      togglePassBtn.textContent = isPass ? 'Hide' : 'Show';
    });
  }

  // Tab switching
  function switchTab(tab, element) {
    mode = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (element) {
      element.classList.add('active');
    } else {
      document.getElementById(tab + 'Tab')?.classList.add('active');
    }
    document.getElementById('nameField').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('displayNameField').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('showForgotLink').style.display = tab === 'register' ? 'none' : 'block';
    document.getElementById('submitBtn').textContent = tab === 'register' ? 'Create account' : 'Sign in';
    hideMessages();
  }

  document.getElementById('loginTab').addEventListener('click', (e) => switchTab('login', e.target));
  document.getElementById('registerTab').addEventListener('click', (e) => switchTab('register', e.target));
  
  // Navigation
  document.getElementById('showForgotLink').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('forgotEmail').value = document.getElementById('email').value;
    showView('forgotView');
  });
  
  document.getElementById('backToLoginFromForgot').addEventListener('click', (e) => {
    e.preventDefault();
    showView('authView');
  });

  function showMessage(msg) { alert(msg); }

  // Login/Register Form
  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const name = document.getElementById('name')?.value || '';
    const username = document.getElementById('username')?.value || '';
    const btn = document.getElementById('submitBtn');

    if (mode === 'register' && !username) {
      return showError('Please enter a username');
    }
    if (mode === 'register' && !name) {
      return showError('Please enter your name');
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Processing...';

    try {
      const data = mode === 'register'
        ? await window.NeuroAPI.AuthAPI.register(username, name, email, password)
        : await window.NeuroAPI.AuthAPI.login(email, password);

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btn.textContent = mode === 'register' ? 'Create account' : 'Sign in';
    }
  });

  // Forgot Password Form
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('forgotEmail').value;
    const btn = document.getElementById('forgotBtn');
    
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Sending...';
    
    try {
      const data = await window.NeuroAPI.AuthAPI.forgotPassword(email);

      showSuccess(data.message || 'Reset link sent successfully!');
      document.getElementById('forgotForm').reset();
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  });

  // Reset Password Form
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const newPassword = document.getElementById('newPassword').value;
    const btn = document.getElementById('resetBtn');
    
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Resetting...';
    
    try {
      const data = await window.NeuroAPI.AuthAPI.resetPassword(resetToken, newPassword);

      localStorage.setItem('token', data.token);
      
      // Fetch user profile to complete login
      const meResponse = await fetch('/api/auth/me', {
        headers: { 'Authorization': `Bearer ${data.token}` }
      });
      
      if (meResponse.ok) {
        const meData = await meResponse.json();
        localStorage.setItem('user', JSON.stringify(meData.user));
      }
      
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btn.textContent = 'Reset password';
    }
  });
</script>

</body>
</html>
